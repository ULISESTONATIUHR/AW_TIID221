<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            /*display: flex;
            flex-direction: row;*/
            display: grid;
            grid-template-columns: repeat(3, 1fr);

           
        }
        .card{
            width: 80px;
            padding: 50px;
            margin: 20px;

        }
        .card-largo{
            grid-column: 3;
            grid-row: span 3;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color: lightblue; width: 80px;">CARD1</div>
        <div class="card" style="background-color: lightgreen;">CARD2</div> 
        <div class="card-largo" style="background-color: lightcoral;">CARD3</div>
        <div class="card" style="background-color: rgb(109, 44, 237);">CARD4</div> 
        <div class="card" style="background-color: rgb(204, 1, 1);">CARD5</div>
        <div class="card" style="background-color: rgb(219, 222, 4);">CARD6</div> 
        <div class="card" style="background-color: rgb(249, 27, 182);">CARD7</div>
    </div>
</body>
</html>
